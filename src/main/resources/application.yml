spring:
  application:
    name: ecocity-esg
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ecocity_esg}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful
  undertow:
    threads:
      # Fixed sizing requested by the assignment: applies to both the "dev" and
      # "test" profiles.
      io: 2
      worker: 10

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
  level:
    com.ecocity.esg: INFO

app:
  license-alert:
    cron: "${APP_LICENSE_ALERT_CRON:-}"
