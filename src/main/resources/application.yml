spring:
  application:
    name: ecocity-esg
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ecocity_esg}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful
  undertow:
    threads:
      # Fixed sizing requested by the assignment: applies to both the "dev" and
      # "test" profiles.
      io: 2
      worker: 10

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,mongo
      validate-group-membership: false
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
  level:
    com.ecocity.esg: INFO

app:
  mongo:
    connect-timeout: ${APP_MONGO_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${APP_MONGO_READ_TIMEOUT:PT15S}
    server-selection-timeout: ${APP_MONGO_SERVER_SELECTION_TIMEOUT:PT5S}
  security:
    editor:
      username: ${APP_EDITOR_USERNAME}
      password: ${APP_EDITOR_PASSWORD}
    admin:
      username: ${APP_ADMIN_USERNAME}
      password: ${APP_ADMIN_PASSWORD}
  license-alert:
    cron: "${APP_LICENSE_ALERT_CRON:-}"
    lease: ${APP_LICENSE_ALERT_LEASE:PT1M}
