name: Publish staging image

on:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: staging-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, build once, and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.resolve.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify application
        run: ./mvnw clean verify
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check immutable tag in GHCR
        id: probe
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository=${GITHUB_REPOSITORY,,}
          registry_token=$(curl --silent --show-error --fail --retry 3 \
            --user "$GITHUB_ACTOR:$GHCR_TOKEN" --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:$repository:pull" \
            https://ghcr.io/token | jq -er .token)
          status=$(curl --silent --show-error --head --retry 3 \
            --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $registry_token" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$repository/manifests/sha-$GITHUB_SHA")
          case "$status" in
            200) echo 'exists=true' >> "$GITHUB_OUTPUT"; echo 'mode=reused' >> "$GITHUB_OUTPUT" ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT"; echo 'mode=published' >> "$GITHUB_OUTPUT" ;;
            *) echo "GHCR manifest check returned HTTP $status; refusing to build over a possible existing tag." >&2; exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and push immutable image
        if: steps.probe.outputs.exists == 'false'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=EcoCity ESG
            org.opencontainers.image.description=EcoCity ESG Spring Boot API
      - name: Resolve exact digest from GHCR
        id: resolve
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          EXISTS: ${{ steps.probe.outputs.exists }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -er .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ "$EXISTS" == false && "$digest" != "$BUILD_DIGEST" ]]; then
            echo 'The GHCR digest differs from the newly published image digest.' >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Record publication
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          MODE: ${{ steps.probe.outputs.mode }}
        run: |
          printf '### Staging publication\n\n- Commit: `%s`\n- Immutable image: `%s:sha-%s`\n- Digest: `%s`\n- Mode: `%s`\n' \
            "$GITHUB_SHA" "$IMAGE" "$GITHUB_SHA" "$DIGEST" "$MODE" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Pull GHCR digest and smoke test
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and test the registry artifact
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: bash scripts/ci/smoke-ghcr.sh "$IMAGE@$DIGEST"
      - name: Record validation
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          printf '### GHCR round-trip passed\n\n- Commit: `%s`\n- Pulled artifact: `%s@%s`\n- Readiness: HTTP 200\n- Unauthenticated write: HTTP 401\n- Authenticated create: HTTP 201\n' \
            "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
