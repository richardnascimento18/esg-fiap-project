name: Publish staging image

on:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: staging-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, build once, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify application
        run: ./mvnw clean verify
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an immutable tag
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          if docker manifest inspect "$IMAGE:sha-$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Immutable tag already exists: $IMAGE:sha-$GITHUB_SHA" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=EcoCity ESG
            org.opencontainers.image.description=EcoCity ESG Spring Boot API
      - name: Record publication
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### Staging publication\n\n- Commit: `%s`\n- Immutable image: `%s:sha-%s`\n- Digest: `%s`\n' \
            "$GITHUB_SHA" "$IMAGE" "$GITHUB_SHA" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Pull GHCR digest and smoke test
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and test the registry artifact
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: bash scripts/ci/smoke-ghcr.sh "$IMAGE@$DIGEST"
      - name: Record validation
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          printf '### GHCR round-trip passed\n\n- Commit: `%s`\n- Pulled artifact: `%s@%s`\n- Readiness: HTTP 200\n- Unauthenticated write: HTTP 401\n- Authenticated create: HTTP 201\n' \
            "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
