name: Pull request CI

on:
  pull_request:
    branches: [staging, production]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Enforce staging source for production PRs
        if: github.base_ref == 'production'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REF" != staging || "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo 'Production pull requests must come from staging in this repository.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify application
        run: ./mvnw clean verify
      - name: Build Dockerfile
        run: docker build -t ecocity-esg:pr-check .
