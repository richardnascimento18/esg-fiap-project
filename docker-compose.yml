services:
  api:
    profiles: ["app"]
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATA_MONGODB_URI: mongodb://ecocity:ecocity_secret@mongodb:27017/ecocity_esg?authSource=admin
      SPRING_DATA_MONGODB_DATABASE: ecocity_esg
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    container_name: ecocity-esg-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ecocity
      MONGO_INITDB_ROOT_PASSWORD: ecocity_secret
      MONGO_INITDB_DATABASE: ecocity_esg
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
