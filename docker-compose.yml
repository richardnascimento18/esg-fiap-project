services:
  api:
    build: .
    stop_grace_period: 30s
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_APP_USER:-ecocity_app}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}@mongodb:27017/ecocity_esg?authSource=ecocity_esg
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-false}
      APP_EDITOR_USERNAME: ${APP_EDITOR_USERNAME:-editor}
      APP_EDITOR_PASSWORD: ${APP_EDITOR_PASSWORD:?Set APP_EDITOR_PASSWORD in .env}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in .env}
      APP_LICENSE_ALERT_CRON: "-"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ecocity

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-ecocity_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_APP_USER: ${MONGO_APP_USER:-ecocity_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ecocity_esg
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecocity

volumes:
  mongodb_data:

networks:
  ecocity:
